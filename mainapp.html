<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McDonalds Chat</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">

  <!-- ЛЕВАЯ ЧАСТЬ: бренд + кнопка друзей -->
  <div class="topbar-left">
    

    <div class="add-friend-wrap">
      <button id="addFriendBtn" type="button" title="Список друзей">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        Друзья
        <span class="friend-badge" id="friendCount">0</span>
      </button>

      <div id="addFriendMenu">
        <div class="friendMenu-title">👥 Список друзей</div>
        <div style="display:flex;gap:8px;">
          <input id="friendInput" type="text" placeholder="Имя пользователя" maxlength="16">
          <button id="addFriendSubmit" type="button">+ Добавить</button>
        </div>
        <div class="friend-divider">Мои друзья</div>
        <div class="friend-list" id="friendList">
          <div class="friends-empty">Список пуст</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ПРАВАЯ ЧАСТЬ: без изменений -->
  <div class="user-panel" id="userPanel" style="display:none;">
  <div class="user-avatar" id="userAvatar">
    U
  </div>

  <div class="user-data">
    <div class="user-name" >
      <p id="userName"></p>
    </div>
  </div>
</div>
 <div class="login_css">

  <div class="loginbtn" style="display:flex; gap:8px;">
  <div id="authButtons">
    <button id="loginBtn">Войти</button>
    <button id="registerBtn">Регистрация</button>
  </div>
  <button id="logoutBtn" style="display:none;">Выйти</button>
</div>
  <div id="loginMenu" class="hidden">
    <input id="login" type="text" placeholder="Логин">
    <input id="password" type="password" placeholder="Пароль">
    <button id="loginSubmit">Войти</button>
  </div>

  <div id="registerMenu" class="hidden">
    <input id="regLogin" type="text" placeholder="Логин">
    <input id="regPassword" type="password" placeholder="Пароль">
    <input id="regPasswordConfirm" type="password" placeholder="Повторите пароль">
    <button id="registerSubmit">Зарегистрироваться</button>
  </div>
</div>


</header>
<div class="content">

  <aside class="groups-panel">

    <div class="groups-header">
      Группы
    </div>

    <div id="groupList">

      <!-- сюда будут добавляться группы -->

    </div>
    <p id="create_Group">Создать группу</p>
  </aside>

  <div class="chat-container">

    <main id="chat" class="chat-area">

    </main>

    <div class="composer">

      <input
        id="text"
        placeholder="Введите сообщение..."
      >
      <button id="sendBtn" type="button">
      Отправить
      </button>
    </div>

  </div>
  
</div>
  <div id="createGroupModal">

    <div class="group-modal">

        <div class="group-modal-header">

            <h2>Создать группу</h2>

            <button id="closeGroupModal">

                ✕

            </button>

        </div>

        <div class="group-modal-body">

            <input
                id="groupName"
                type="text"
                placeholder="Название группы"
                maxlength="30"
            >
            <div id="submitinviteGroup" class="submit_inviteGroup">
            <p>Выбранные пользователи</p>
            </div>
            <p>Выберите друзей</p>
            
            <div class="invitefriendlist" id="invitegrouplist">
              
            </div>

        </div>

        <div class="group-modal-footer">

            <button id="createGroupBtn">

                Создать

            </button>

        </div>

    </div>

</div>
</div>

    

  <script src="client_app.js"></script>
</body>
</html>
